services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowgate
      POSTGRES_USER: flowgate
      POSTGRES_PASSWORD: flowgate
    ports:
      - "5432:5432"
    volumes:
      - flowgate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgate -d flowgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8474:8474"
      - "16379:16379"
    volumes:
      - ./observability/toxiproxy/redis.json:/config/redis.json:ro
    command: ["-host", "0.0.0.0", "-config", "/config/redis.json"]

  prometheus:
    image: prom/prometheus:v2.55.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana-oss:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger

volumes:
  flowgate_pg:
