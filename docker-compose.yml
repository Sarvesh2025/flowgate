services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowgate
      POSTGRES_USER: flowgate
      POSTGRES_PASSWORD: flowgate
    ports:
      - "5432:5432"
    volumes:
      - flowgate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowgate -d flowgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flowgate_pg:
