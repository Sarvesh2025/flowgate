server:
  port: 8080

spring:
  application:
    name: flowgate-gateway
  datasource:
    url: jdbc:postgresql://${FLOWGATE_DB_HOST:localhost}:5432/flowgate
    username: flowgate
    password: flowgate
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${FLOWGATE_REDIS_HOST:localhost}
      port: ${FLOWGATE_REDIS_PORT:6379}
      timeout: 300ms
      connect-timeout: 300ms

flowgate:
  instance-id: ${FLOWGATE_INSTANCE:a}
  jwt:
    secret: flowgate-dev-secret-change-me-32b!!
    expiration-ms: 900000
  ratelimit:
    path: /api/v1/limited
    # TOKEN_BUCKET | SLIDING_WINDOW_COUNTER | SLIDING_WINDOW_LOG | FIXED_WINDOW
    algorithm: SLIDING_WINDOW_COUNTER
    capacity: 10
    window-ms: 1000
    # FAIL_CLOSED | FAIL_OPEN — used when no DB rule matches
    redis-down-policy: FAIL_CLOSED
  proxy:
    connect-timeout-ms: 200
    read-timeout-ms: 2000
    max-body-bytes: 1048576
    cache-ttl-seconds: 5
    health-interval-ms: 10000
    ip-allow: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${FLOWGATE_OTLP_TRACES:http://localhost:4318/v1/traces}
  health:
    redis:
      enabled: true
    db:
      enabled: true

logging:
  structured:
    format:
      console: logstash
