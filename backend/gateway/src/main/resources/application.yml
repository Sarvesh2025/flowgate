server:
  port: 8080

spring:
  application:
    name: flowgate-gateway
  datasource:
    url: jdbc:postgresql://${FLOWGATE_DB_HOST:localhost}:5432/flowgate
    username: flowgate
    password: flowgate
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${FLOWGATE_REDIS_HOST:localhost}
      port: 6379

flowgate:
  jwt:
    secret: flowgate-dev-secret-change-me-32b!!
    expiration-ms: 900000
  ratelimit:
    path: /api/v1/limited
    # TOKEN_BUCKET | SLIDING_WINDOW_COUNTER | SLIDING_WINDOW_LOG | FIXED_WINDOW
    algorithm: SLIDING_WINDOW_COUNTER
    capacity: 10
    window-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true
